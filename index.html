<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
 
<script type="text/babel">
const { useState, useEffect, useCallback } = React;
 
const GOAL = 2404;
const P_CAL=4, C_CAL=4, F_CAL=9;
const MACRO_GOALS = {protein:180,carbs:250,fat:80};
const STORAGE_KEY = "fuel_tracker_v1";
 
function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
 
function loadAll() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}"); }
  catch { return {}; }
}
function saveAll(data) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}
function dayCalories(entries=[]) {
  return entries.reduce((s,e)=>s+e.protein*P_CAL+e.carbs*C_CAL+e.fat*F_CAL+(e.directCal||0),0);
}
 
async function estimateMacros(desc) {
  const res = await fetch("https://api.anthropic.com/v1/messages",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      model:"claude-sonnet-4-20250514",
      max_tokens:300,
      system:`You are a nutrition expert. Respond ONLY with JSON, no markdown, no explanation:
{"name":"short food name","calories":number,"protein":number,"carbs":number,"fat":number}
All macros in grams rounded to nearest integer. calories = P*4+C*4+F*9.`,
      messages:[{role:"user",content:desc}]
    })
  });
  const data = await res.json();
  return JSON.parse(data.content[0].text.trim());
}
 
// Mini ring for calendar
function MiniRing({calories, size=36}) {
  const r = (size-6)/2;
  const circ = 2*Math.PI*r;
  const pct = Math.min(calories/GOAL,1);
  const over = calories>GOAL;
  const color = over?"#ff6b6b":"#e8ff5a";
  const offset = circ*(1-pct);
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{transform:"rotate(-90deg)"}}>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="#2a2a2a" strokeWidth="3"/>
      {calories>0&&<circle cx={size/2} cy={size/2} r={r} fill="none" stroke={color}
        strokeWidth="3" strokeDasharray={circ} strokeDashoffset={offset} strokeLinecap="round"/>}
    </svg>
  );
}
 
const css = `
  .app{max-width:480px;margin:0 auto;padding:0 0 80px;}
 
  /* Tab bar */
  .tab-bar{display:flex;background:#111;border-bottom:1px solid #1e1e1e;margin-bottom:0;position:sticky;top:0;z-index:10;}
  .tab-btn{flex:1;padding:14px;font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:3px;
    background:none;border:none;color:#444;cursor:pointer;transition:color 0.2s,border-bottom 0.2s;
    border-bottom:2px solid transparent;}
  .tab-btn.active{color:#e8ff5a;border-bottom:2px solid #e8ff5a;}
 
  .page{padding:20px 16px;}
 
  .header{text-align:center;margin-bottom:28px;}
  .header h1{font-family:'Bebas Neue',sans-serif;font-size:52px;letter-spacing:4px;color:#f0ede6;line-height:1;}
  .header .sub{font-size:11px;letter-spacing:3px;color:#666;text-transform:uppercase;margin-top:4px;}
 
  .ring-section{display:flex;flex-direction:column;align-items:center;margin-bottom:28px;}
  .ring-wrap{position:relative;width:200px;height:200px;}
  .ring-wrap svg{transform:rotate(-90deg);}
  .ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .ring-center .cal-num{font-family:'Bebas Neue',sans-serif;font-size:44px;line-height:1;color:#f0ede6;}
  .ring-center .cal-label{font-size:10px;letter-spacing:2px;color:#666;text-transform:uppercase;}
  .remaining-bar{margin-top:12px;font-size:11px;letter-spacing:2px;color:#888;text-transform:uppercase;}
  .remaining-bar span{color:#e8ff5a;}
 
  .macros-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:24px;}
  .macro-card{background:#191919;border:1px solid #2a2a2a;border-radius:12px;padding:14px 10px;text-align:center;}
  .macro-card .macro-label{font-size:10px;letter-spacing:2px;color:#555;text-transform:uppercase;margin-bottom:6px;}
  .macro-card .macro-val{font-family:'Bebas Neue',sans-serif;font-size:32px;line-height:1;margin-bottom:4px;}
  .macro-card .macro-goal{font-size:10px;color:#444;}
  .macro-bar-bg{height:3px;background:#2a2a2a;border-radius:2px;margin-top:8px;overflow:hidden;}
  .macro-bar-fill{height:100%;border-radius:2px;transition:width 0.4s ease;}
  .protein .macro-val{color:#ff6b6b;} .protein .macro-bar-fill{background:#ff6b6b;}
  .carbs .macro-val{color:#e8ff5a;}   .carbs .macro-bar-fill{background:#e8ff5a;}
  .fat .macro-val{color:#74c0fc;}     .fat .macro-bar-fill{background:#74c0fc;}
 
  .ai-card{background:#191919;border:1px solid #2a2a2a;border-radius:16px;padding:20px;margin-bottom:16px;}
  .ai-card h2{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:2px;margin-bottom:4px;color:#888;}
  .ai-badge{display:inline-block;font-size:9px;letter-spacing:2px;text-transform:uppercase;
    background:#e8ff5a22;color:#e8ff5a;border:1px solid #e8ff5a44;border-radius:4px;padding:2px 6px;margin-bottom:14px;}
  .ai-input-row{display:flex;gap:8px;}
  .ai-input{flex:1;background:#111;border:1px solid #2a2a2a;border-radius:8px;
    padding:11px 12px;color:#f0ede6;font-family:'Space Mono',monospace;font-size:13px;outline:none;}
  .ai-input:focus{border-color:#e8ff5a;}
  .ai-input::placeholder{color:#444;}
  .ai-btn{background:#e8ff5a;color:#0d0d0d;border:none;border-radius:8px;
    padding:11px 16px;font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:2px;cursor:pointer;}
  .ai-btn:disabled{opacity:0.4;cursor:not-allowed;}
  .ai-result{margin-top:12px;background:#111;border:1px solid #2a2a2a;border-radius:10px;padding:14px;animation:fadeIn 0.3s ease;}
  .ai-result-name{font-size:12px;color:#e8ff5a;margin-bottom:8px;letter-spacing:1px;}
  .ai-result-macros{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px;}
  .ai-macro-chip{text-align:center;}
  .ai-macro-chip .chip-val{font-family:'Bebas Neue',sans-serif;font-size:22px;}
  .ai-macro-chip .chip-label{font-size:9px;letter-spacing:1px;color:#555;text-transform:uppercase;}
  .ai-add-btn{width:100%;background:#e8ff5a;color:#0d0d0d;border:none;border-radius:8px;
    padding:10px;font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:2px;cursor:pointer;}
  .ai-error{margin-top:10px;font-size:11px;color:#ff6b6b;letter-spacing:1px;}
  .ai-loading{margin-top:10px;font-size:11px;letter-spacing:2px;color:#555;text-transform:uppercase;text-align:center;padding:10px;}
 
  .form-card{background:#191919;border:1px solid #2a2a2a;border-radius:16px;padding:20px;margin-bottom:24px;}
  .form-card h2{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:2px;margin-bottom:16px;color:#888;}
  .inputs-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px;}
  .input-group label{display:block;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:#555;margin-bottom:5px;}
  .input-group input{width:100%;background:#111;border:1px solid #2a2a2a;border-radius:8px;
    padding:10px 8px;color:#f0ede6;font-family:'Space Mono',monospace;font-size:14px;text-align:center;outline:none;}
  .input-group input:focus{border-color:#e8ff5a;}
  .add-btn{width:100%;background:#e8ff5a;color:#0d0d0d;border:none;border-radius:10px;
    padding:13px;font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:3px;cursor:pointer;}
  .divider{display:flex;align-items:center;gap:10px;margin:10px 0 12px;}
  .divider-line{flex:1;height:1px;background:#2a2a2a;}
  .divider-text{font-size:10px;letter-spacing:2px;color:#444;text-transform:uppercase;}
 
  .log-section h2{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:2px;
    color:#888;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;}
  .clear-btn{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:1px;
    background:none;border:1px solid #2a2a2a;color:#555;border-radius:6px;padding:4px 10px;cursor:pointer;}
  .log-empty{text-align:center;font-size:11px;letter-spacing:2px;color:#333;padding:24px 0;text-transform:uppercase;}
  .log-entry{display:flex;justify-content:space-between;align-items:center;
    padding:12px 14px;background:#191919;border:1px solid #2a2a2a;border-radius:10px;margin-bottom:8px;animation:fadeIn 0.2s ease;}
  .log-entry .entry-time{font-size:10px;color:#444;margin-bottom:3px;}
  .log-entry .entry-name{font-size:12px;color:#e8ff5a;margin-bottom:2px;}
  .log-entry .entry-macros{font-size:11px;color:#666;}
  .log-entry .entry-cals{font-family:'Bebas Neue',sans-serif;font-size:24px;color:#e8ff5a;}
  .delete-btn{background:none;border:none;color:#333;cursor:pointer;font-size:16px;padding:0 0 0 10px;}
  .over{color:#ff6b6b !important;}
 
  /* Calendar */
  .cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
  .cal-title{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:3px;color:#f0ede6;}
  .cal-nav{background:none;border:1px solid #2a2a2a;color:#888;border-radius:8px;
    padding:6px 14px;font-family:'Bebas Neue',sans-serif;font-size:18px;cursor:pointer;letter-spacing:1px;}
  .cal-nav:active{color:#e8ff5a;border-color:#e8ff5a;}
  .cal-dow{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:8px;}
  .cal-dow-cell{text-align:center;font-size:9px;letter-spacing:2px;color:#444;text-transform:uppercase;padding:4px 0;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  .cal-cell{display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 2px;
    border-radius:10px;cursor:pointer;transition:background 0.15s;position:relative;}
  .cal-cell:active{background:#1e1e1e;}
  .cal-cell.today .cal-day-num{color:#e8ff5a;}
  .cal-cell.empty{pointer-events:none;}
  .cal-day-num{font-size:11px;letter-spacing:1px;color:#666;}
  .cal-cell.has-data .cal-day-num{color:#f0ede6;}
  .cal-legend{display:flex;gap:16px;justify-content:center;margin-top:20px;}
  .legend-item{display:flex;align-items:center;gap:6px;font-size:10px;letter-spacing:1px;color:#555;text-transform:uppercase;}
  .legend-dot{width:8px;height:8px;border-radius:50%;}
 
  .cal-detail{margin-top:24px;background:#191919;border:1px solid #2a2a2a;border-radius:16px;padding:20px;animation:fadeIn 0.25s ease;}
  .cal-detail h3{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:2px;color:#888;margin-bottom:16px;}
  .cal-detail-ring{display:flex;align-items:center;gap:16px;margin-bottom:16px;}
  .cal-detail-nums{flex:1;}
  .cal-detail-cal{font-family:'Bebas Neue',sans-serif;font-size:36px;line-height:1;}
  .cal-detail-sub{font-size:10px;letter-spacing:2px;color:#555;text-transform:uppercase;margin-top:2px;}
  .cal-detail-macros{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .cdm{text-align:center;background:#111;border-radius:8px;padding:10px 6px;}
  .cdm-val{font-family:'Bebas Neue',sans-serif;font-size:22px;}
  .cdm-label{font-size:9px;letter-spacing:1px;color:#555;text-transform:uppercase;}
 
  @keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
`;
 
function App() {
  const [allData, setAllData] = useState(() => loadAll());
  const [tab, setTab] = useState("tracker");
  const [form, setForm] = useState({protein:"",carbs:"",fat:"",calories:""});
  const [aiInput, setAiInput] = useState("");
  const [aiResult, setAiResult] = useState(null);
  const [aiLoading, setAiLoading] = useState(false);
  const [aiError, setAiError] = useState("");
  const today = todayStr();
  const [calMonth, setCalMonth] = useState(() => { const d=new Date(); return {y:d.getFullYear(),m:d.getMonth()}; });
  const [selectedDay, setSelectedDay] = useState(null);
 
  const entries = allData[today] || [];
 
  const persist = useCallback((data) => {
    setAllData(data);
    saveAll(data);
  },[]);
 
  const totalProtein = entries.reduce((s,e)=>s+e.protein,0);
  const totalCarbs   = entries.reduce((s,e)=>s+e.carbs,0);
  const totalFat     = entries.reduce((s,e)=>s+e.fat,0);
  const totalCal     = dayCalories(entries);
  const remaining    = GOAL - totalCal;
  const isOver       = totalCal > GOAL;
  const R=88, CIRC=2*Math.PI*R;
  const pct = Math.min(totalCal/GOAL,1);
  const dashOffset = CIRC*(1-pct);
 
  const addEntry = (entry) => {
    const time = new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});
    const newEntry = {...entry, time, id:Date.now()};
    const updated = {...allData, [today]: [newEntry,...entries]};
    persist(updated);
  };
 
  const deleteEntry = (id) => {
    const updated = {...allData, [today]: entries.filter(e=>e.id!==id)};
    persist(updated);
  };
 
  const clearToday = () => {
    const updated = {...allData, [today]: []};
    persist(updated);
  };
 
  const handleManualAdd = () => {
    const p=parseFloat(form.protein)||0, c=parseFloat(form.carbs)||0;
    const f=parseFloat(form.fat)||0,   cal=parseFloat(form.calories)||0;
    if(!p&&!c&&!f&&!cal) return;
    addEntry({protein:p,carbs:c,fat:f,directCal:cal,name:""});
    setForm({protein:"",carbs:"",fat:"",calories:""});
  };
 
  const handleAiLookup = async () => {
    if(!aiInput.trim()) return;
    setAiLoading(true); setAiResult(null); setAiError("");
    try { setAiResult(await estimateMacros(aiInput)); }
    catch { setAiError("Couldn't estimate — try rephrasing."); }
    setAiLoading(false);
  };
 
  const handleAiAdd = () => {
    if(!aiResult) return;
    addEntry({protein:aiResult.protein,carbs:aiResult.carbs,fat:aiResult.fat,directCal:0,name:aiResult.name});
    setAiResult(null); setAiInput("");
  };
 
  const macroPct = (val,goal) => Math.min((val/goal)*100,100);
 
  // Calendar helpers
  const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
  const DOW=["Su","Mo","Tu","We","Th","Fr","Sa"];
  const firstDay = new Date(calMonth.y, calMonth.m, 1).getDay();
  const daysInMonth = new Date(calMonth.y, calMonth.m+1, 0).getDate();
  const todayObj = new Date();
 
  const calCells = [];
  for(let i=0;i<firstDay;i++) calCells.push(null);
  for(let d=1;d<=daysInMonth;d++) calCells.push(d);
 
  const dayKey = (d) => `${calMonth.y}-${String(calMonth.m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
 
  const selDayEntries = selectedDay ? (allData[dayKey(selectedDay)]||[]) : [];
  const selDayCal     = dayCalories(selDayEntries);
  const selDayOver    = selDayCal > GOAL;
  const selDayPct     = Math.min(selDayCal/GOAL,1);
  const selR=52, selCirc=2*Math.PI*selR;
 
  return (
    <>
      <style>{css}</style>
      <div className="app">
        <div className="tab-bar">
          <button className={`tab-btn${tab==="tracker"?" active":""}`} onClick={()=>setTab("tracker")}>TRACKER</button>
          <button className={`tab-btn${tab==="calendar"?" active":""}`} onClick={()=>setTab("calendar")}>CALENDAR</button>
        </div>
 
        {tab==="tracker" && (
          <div className="page">
            <div className="header">
              <h1>FUEL</h1>
              <div className="sub">Daily Calorie Tracker</div>
            </div>
 
            <div className="ring-section">
              <div className="ring-wrap">
                <svg width="200" height="200" viewBox="0 0 200 200">
                  <circle cx="100" cy="100" r={R} fill="none" stroke="#1e1e1e" strokeWidth="14"/>
                  <circle cx="100" cy="100" r={R} fill="none"
                    stroke={isOver?"#ff6b6b":"#e8ff5a"} strokeWidth="14"
                    strokeDasharray={CIRC} strokeDashoffset={dashOffset} strokeLinecap="round"
                    style={{transition:"stroke-dashoffset 0.5s ease,stroke 0.3s"}}/>
                </svg>
                <div className="ring-center">
                  <div className={`cal-num${isOver?" over":""}`}>{totalCal}</div>
                  <div className="cal-label">of {GOAL} kcal</div>
                </div>
              </div>
              <div className="remaining-bar">
                {isOver
                  ? <><span style={{color:"#ff6b6b"}}>{Math.abs(remaining)}</span> cal over</>
                  : <><span>{remaining}</span> cal remaining</>}
              </div>
            </div>
 
            <div className="macros-grid">
              {[
                {key:"protein",label:"Protein",val:totalProtein,goal:MACRO_GOALS.protein,cls:"protein"},
                {key:"carbs",  label:"Carbs",  val:totalCarbs,  goal:MACRO_GOALS.carbs,  cls:"carbs"},
                {key:"fat",    label:"Fat",    val:totalFat,    goal:MACRO_GOALS.fat,    cls:"fat"},
              ].map(({key,label,val,goal,cls})=>(
                <div key={key} className={`macro-card ${cls}`}>
                  <div className="macro-label">{label}</div>
                  <div className="macro-val">{val}<span style={{fontSize:14}}>g</span></div>
                  <div className="macro-goal">/ {goal}g</div>
                  <div className="macro-bar-bg"><div className="macro-bar-fill" style={{width:`${macroPct(val,goal)}%`}}/></div>
                </div>
              ))}
            </div>
 
            <div className="ai-card">
              <h2>DESCRIBE YOUR FOOD</h2>
              <div className="ai-badge">✦ AI Powered</div>
              <div className="ai-input-row">
                <input className="ai-input" placeholder="e.g. 2 rice cakes with 1 tsp maple syrup"
                  value={aiInput} onChange={e=>setAiInput(e.target.value)}
                  onKeyDown={e=>e.key==="Enter"&&handleAiLookup()}/>
                <button className="ai-btn" onClick={handleAiLookup} disabled={aiLoading||!aiInput.trim()}>
                  {aiLoading?"...":"GO"}
                </button>
              </div>
              {aiLoading&&<div className="ai-loading">Estimating macros...</div>}
              {aiError&&<div className="ai-error">{aiError}</div>}
              {aiResult&&(
                <div className="ai-result">
                  <div className="ai-result-name">{aiResult.name}</div>
                  <div className="ai-result-macros">
                    {[
                      {label:"Cal", val:aiResult.calories,color:"#e8ff5a"},
                      {label:"Prot",val:aiResult.protein, color:"#ff6b6b"},
                      {label:"Carbs",val:aiResult.carbs,  color:"#e8ff5a"},
                      {label:"Fat", val:aiResult.fat,     color:"#74c0fc"},
                    ].map(({label,val,color})=>(
                      <div key={label} className="ai-macro-chip">
                        <div className="chip-val" style={{color}}>{val}</div>
                        <div className="chip-label">{label}</div>
                      </div>
                    ))}
                  </div>
                  <button className="ai-add-btn" onClick={handleAiAdd}>+ LOG THIS</button>
                </div>
              )}
            </div>
 
            <div className="form-card">
              <h2>ADD MANUALLY</h2>
              <div className="inputs-row">
                {[{key:"protein",label:"Protein (g)"},{key:"carbs",label:"Carbs (g)"},{key:"fat",label:"Fat (g)"}].map(({key,label})=>(
                  <div key={key} className="input-group">
                    <label>{label}</label>
                    <input type="number" min="0" placeholder="0" value={form[key]}
                      onChange={e=>setForm({...form,[key]:e.target.value})}
                      onKeyDown={e=>e.key==="Enter"&&handleManualAdd()}/>
                  </div>
                ))}
              </div>
              <div className="divider">
                <div className="divider-line"/>
                <span className="divider-text">or just calories</span>
                <div className="divider-line"/>
              </div>
              <div className="input-group" style={{marginBottom:12}}>
                <label>Calories only (kcal)</label>
                <input type="number" min="0" placeholder="0" value={form.calories}
                  onChange={e=>setForm({...form,calories:e.target.value})}
                  onKeyDown={e=>e.key==="Enter"&&handleManualAdd()}
                  style={{textAlign:"center",fontSize:16}}/>
              </div>
              <button className="add-btn" onClick={handleManualAdd}>+ ADD</button>
            </div>
 
            <div className="log-section">
              <h2>
                LOG
                {entries.length>0&&<button className="clear-btn" onClick={clearToday}>CLEAR ALL</button>}
              </h2>
              {entries.length===0
                ? <div className="log-empty">No entries yet</div>
                : entries.map(e=>{
                    const cal=e.protein*P_CAL+e.carbs*C_CAL+e.fat*F_CAL+(e.directCal||0);
                    return(
                      <div key={e.id} className="log-entry">
                        <div>
                          <div className="entry-time">{e.time}</div>
                          {e.name&&<div className="entry-name">{e.name}</div>}
                          <div className="entry-macros">
                            {e.directCal&&!e.protein&&!e.carbs&&!e.fat
                              ?"Calories only"
                              :`P ${e.protein}g · C ${e.carbs}g · F ${e.fat}g`}
                          </div>
                        </div>
                        <div style={{display:"flex",alignItems:"center"}}>
                          <div className="entry-cals">{cal}</div>
                          <button className="delete-btn" onClick={()=>deleteEntry(e.id)}>×</button>
                        </div>
                      </div>
                    );
                  })
              }
            </div>
          </div>
        )}
 
        {tab==="calendar" && (
          <div className="page">
            <div className="cal-header">
              <button className="cal-nav" onClick={()=>setCalMonth(p=>p.m===0?{y:p.y-1,m:11}:{y:p.y,m:p.m-1})}>‹</button>
              <div className="cal-title">{MONTHS[calMonth.m]} {calMonth.y}</div>
              <button className="cal-nav" onClick={()=>setCalMonth(p=>p.m===11?{y:p.y+1,m:0}:{y:p.y,m:p.m+1})}>›</button>
            </div>
 
            <div className="cal-dow">
              {DOW.map(d=><div key={d} className="cal-dow-cell">{d}</div>)}
            </div>
 
            <div className="cal-grid">
              {calCells.map((d,i)=>{
                if(!d) return <div key={`e${i}`} className="cal-cell empty"/>;
                const dk = dayKey(d);
                const dayEntries = allData[dk]||[];
                const dayCal = dayCalories(dayEntries);
                const hasData = dayCal>0;
                const isToday = calMonth.y===todayObj.getFullYear()&&calMonth.m===todayObj.getMonth()&&d===todayObj.getDate();
                const isSel = selectedDay===d;
                return (
                  <div key={d} className={`cal-cell${isToday?" today":""}${hasData?" has-data":""}${isSel?" selected":""}`}
                    onClick={()=>setSelectedDay(selectedDay===d?null:d)}
                    style={isSel?{background:"#1e1e1e",borderRadius:10}:{}}
                  >
                    <MiniRing calories={dayCal} size={38}/>
                    <div className="cal-day-num">{d}</div>
                  </div>
                );
              })}
            </div>
 
            <div className="cal-legend">
              <div className="legend-item"><div className="legend-dot" style={{background:"#e8ff5a"}}/> Under goal</div>
              <div className="legend-item"><div className="legend-dot" style={{background:"#ff6b6b"}}/> Over goal</div>
              <div className="legend-item"><div className="legend-dot" style={{background:"#2a2a2a"}}/> No data</div>
            </div>
 
            {selectedDay && (
              <div className="cal-detail">
                <h3>{MONTHS[calMonth.m]} {selectedDay}</h3>
                {selDayCal===0
                  ? <div className="log-empty" style={{padding:"12px 0"}}>No data for this day</div>
                  : <>
                    <div className="cal-detail-ring">
                      <svg width="120" height="120" viewBox="0 0 120 120" style={{transform:"rotate(-90deg)",flexShrink:0}}>
                        <circle cx="60" cy="60" r={selR} fill="none" stroke="#1e1e1e" strokeWidth="10"/>
                        <circle cx="60" cy="60" r={selR} fill="none"
                          stroke={selDayOver?"#ff6b6b":"#e8ff5a"} strokeWidth="10"
                          strokeDasharray={selCirc} strokeDashoffset={selCirc*(1-selDayPct)}
                          strokeLinecap="round"/>
                      </svg>
                      <div className="cal-detail-nums">
                        <div className="cal-detail-cal" style={{color:selDayOver?"#ff6b6b":"#e8ff5a"}}>{selDayCal}</div>
                        <div className="cal-detail-sub">of {GOAL} kcal</div>
                        <div style={{marginTop:6,fontSize:11,color:selDayOver?"#ff6b6b":"#888",letterSpacing:1}}>
                          {selDayOver?`${selDayCal-GOAL} over`:`${GOAL-selDayCal} remaining`}
                        </div>
                      </div>
                    </div>
                    <div className="cal-detail-macros">
                      {[
                        {label:"Protein",val:selDayEntries.reduce((s,e)=>s+e.protein,0),color:"#ff6b6b"},
                        {label:"Carbs",  val:selDayEntries.reduce((s,e)=>s+e.carbs,0),  color:"#e8ff5a"},
                        {label:"Fat",    val:selDayEntries.reduce((s,e)=>s+e.fat,0),    color:"#74c0fc"},
                      ].map(({label,val,color})=>(
                        <div key={label} className="cdm">
                          <div className="cdm-val" style={{color}}>{val}g</div>
                          <div className="cdm-label">{label}</div>
                        </div>
                      ))}
                    </div>
                  </>
                }
              </div>
            )}
          </div>
        )}
      </div>
    </>
  );
}
 
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
