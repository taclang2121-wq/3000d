function unitLabel(food){
  if(food.unit==="g")   return{input:"g",   hint:`per ${food.base}g`,   default:food.base};
  if(food.unit==="ml")  return{input:"ml",  hint:`per ${food.base}ml`,  default:food.base};
  if(food.unit==="srv") return{input:"srv", hint:"servings",             default:1};
}

function scaledMacros(food, amount){
  const mult = amount / food.base;
  return {
    cal: Math.round(food.cal*mult),
    p:   Math.round(food.p*mult),
    c:   Math.round(food.c*mult),
    f:   Math.round(food.f*mult),
  };
}

function todayStr(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function loadAll(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||"{}");}catch{return {};}}
function saveAll(d){localStorage.setItem(STORAGE_KEY,JSON.stringify(d));}
function dayCalories(entries=[]){return entries.reduce((s,e)=>s+e.p*P_CAL+e.c*C_CAL+e.f*F_CAL+(e.directCal||0),0);}

function MiniRing({calories,size=38}){
  const r=(size-6)/2,circ=2*Math.PI*r,pct=Math.min(calories/GOAL,1),over=calories>GOAL;
  return(
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{transform:"rotate(-90deg)"}}>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="#2a2a2a" strokeWidth="3"/>
      {calories>0&&<circle cx={size/2} cy={size/2} r={r} fill="none"
        stroke={over?"#ff6b6b":"#e8ff5a"} strokeWidth="3"
        strokeDasharray={circ} strokeDashoffset={circ*(1-pct)} strokeLinecap="round"/>}
    </svg>
  );
}

  .legend-dot{width:8px;height:8px;border-radius:50%;}
  .cal-detail{margin-top:24px;background:#191919;border:1px solid #2a2a2a;border-radius:16px;padding:20px;animation:fadeIn 0.25s ease;}
  .cal-detail h3{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:2px;color:#888;margin-bottom:16px;}
  .cal-detail-ring{display:flex;align-items:center;gap:16px;margin-bottom:16px;}
  .cal-detail-cal{font-family:'Bebas Neue',sans-serif;font-size:36px;line-height:1;}
  .cal-detail-sub{font-size:10px;letter-spacing:2px;color:#555;text-transform:uppercase;margin-top:2px;}
  .cal-detail-macros{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .cdm{text-align:center;background:#111;border-radius:8px;padding:10px 6px;}
  .cdm-val{font-family:'Bebas Neue',sans-serif;font-size:22px;}
  .cdm-label{font-size:9px;letter-spacing:1px;color:#555;text-transform:uppercase;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
`;

// Amount Picker component
function AmountPicker({food, onAdd, onCancel}){
  const ul = unitLabel(food);
  const [amount, setAmount] = useState(String(ul.default));
  const parsed = parseFloat(amount)||0;
  const preview = parsed>0 ? scaledMacros(food,parsed) : {cal:0,p:0,c:0,f:0};

  const step = food.unit==="srv" ? 0.5 : (food.unit==="ml" ? 50 : 25);

  const nudge = (dir) => {
    const cur = parseFloat(amount)||0;
    const next = Math.max(step, cur + dir*step);
    setAmount(food.unit==="srv" ? String(next) : String(Math.round(next)));
  };

  return(
    <div className="amount-picker">
      <div className="amount-picker-title">{food.name}</div>
      <div className="amount-row">
        <button className="amount-minus" onClick={()=>nudge(-1)}>−</button>
        <div className="amount-input-wrap">
          <input className="amount-input" type="number" min="1" value={amount}
            onChange={e=>setAmount(e.target.value)}/>
          <span className="amount-unit">{ul.input}</span>
        </div>
        <button className="amount-plus" onClick={()=>nudge(1)}>+</button>
      </div>
      <div className="amount-preview">
        {[
          {label:"Cal", val:preview.cal, color:"#e8ff5a"},
          {label:"Prot",val:`${preview.p}g`, color:"#ff6b6b"},
          {label:"Carbs",val:`${preview.c}g`,color:"#e8ff5a"},
          {label:"Fat", val:`${preview.f}g`, color:"#74c0fc"},
        ].map(({label,val,color})=>(
          <div key={label} className="prev-chip">
            <div className="prev-val" style={{color}}>{val}</div>
            <div className="prev-label">{label}</div>
          </div>
        ))}
      </div>
      <button className="amount-add-btn" onClick={()=>parsed>0&&onAdd(food,parsed,preview)}>+ LOG IT</button>
      <button className="amount-cancel" onClick={onCancel}>cancel</button>
    </div>
  );
}

function App(){
  const [allData,setAllData]=useState(()=>loadAll());
  const [tab,setTab]=useState("tracker");
  const [searchQ,setSearchQ]=useState("");
  const [selectedFood,setSelectedFood]=useState(null);
  const [form,setForm]=useState({protein:"",carbs:"",fat:"",calories:""});
  const [calMonth,setCalMonth]=useState(()=>{const d=new Date();return{y:d.getFullYear(),m:d.getMonth()};});
  const [selectedDay,setSelectedDay]=useState(null);
  const today=todayStr();
  const entries=allData[today]||[];

  const persist=useCallback((data)=>{setAllData(data);saveAll(data);},[]);

  const totalP=entries.reduce((s,e)=>s+e.p,0);
  const totalC=entries.reduce((s,e)=>s+e.c,0);
  const totalF=entries.reduce((s,e)=>s+e.f,0);
  const totalCal=dayCalories(entries);
  const remaining=GOAL-totalCal;
  const isOver=totalCal>GOAL;
  const R=88,CIRC=2*Math.PI*R,pct=Math.min(totalCal/GOAL,1);

  const addEntry=(entry)=>{
    const time=new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});
    persist({...allData,[today]:[{...entry,time,id:Date.now()},...entries]});
  };
  const deleteEntry=(id)=>persist({...allData,[today]:entries.filter(e=>e.id!==id)});
  const clearToday=()=>persist({...allData,[today]:[]});
  const macroPct=(v,g)=>Math.min((v/g)*100,100);

  const searchResults=useMemo(()=>{
    if(!searchQ.trim()) return [];
    const q=searchQ.toLowerCase();
    return FOODS.filter(f=>f.name.toLowerCase().includes(q)).slice(0,10);
  },[searchQ]);

  const handleFoodTap=(food)=>{
    setSelectedFood(food);
  };

  const handleAmountAdd=(food,amount,preview)=>{
    const ul=unitLabel(food);
    const amtLabel = food.unit==="srv"
      ? (amount===1?`×1`:`×${amount}`)
      : `${amount}${ul.input}`;
    addEntry({name:`${food.name} (${amtLabel})`,p:preview.p,c:preview.c,f:preview.f,directCal:0});
    setSelectedFood(null);
    setSearchQ("");
  };

  const handleManualAdd=()=>{
    const p=parseFloat(form.protein)||0,c=parseFloat(form.carbs)||0;
    const f=parseFloat(form.fat)||0,cal=parseFloat(form.calories)||0;
    if(!p&&!c&&!f&&!cal) return;
    addEntry({name:"",p,c,f,directCal:cal});
    setForm({protein:"",carbs:"",fat:"",calories:""});
  };

  // Calendar
  const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
  const DOW=["Su","Mo","Tu","We","Th","Fr","Sa"];
  const firstDay=new Date(calMonth.y,calMonth.m,1).getDay();
  const daysInMonth=new Date(calMonth.y,calMonth.m+1,0).getDate();
  const todayObj=new Date();
  const calCells=[];
  for(let i=0;i<firstDay;i++) calCells.push(null);
  for(let d=1;d<=daysInMonth;d++) calCells.push(d);
  const dayKey=(d)=>`${calMonth.y}-${String(calMonth.m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  const selEntries=selectedDay?(allData[dayKey(selectedDay)]||[]):[];
  const selCal=dayCalories(selEntries);
  const selOver=selCal>GOAL;
  const selR=52,selCirc=2*Math.PI*selR;

  return(
    <>
      <style>{css}</style>
      <div className="app">
        <div className="tab-bar">
          <button className={`tab-btn${tab==="tracker"?" active":""}`} onClick={()=>setTab("tracker")}>TRACKER</button>
          <button className={`tab-btn${tab==="calendar"?" active":""}`} onClick={()=>setTab("calendar")}>CALENDAR</button>
        </div>

        {tab==="tracker"&&(
          <div className="page">
            <div className="header"><h1>FUEL</h1><div className="sub">Daily Calorie Tracker</div></div>

            <div className="ring-section">
              <div className="ring-wrap">
                <svg width="200" height="200" viewBox="0 0 200 200">
                  <circle cx="100" cy="100" r={R} fill="none" stroke="#1e1e1e" strokeWidth="14"/>
                  <circle cx="100" cy="100" r={R} fill="none"
                    stroke={isOver?"#ff6b6b":"#e8ff5a"} strokeWidth="14"
                    strokeDasharray={CIRC} strokeDashoffset={CIRC*(1-pct)} strokeLinecap="round"
                    style={{transition:"stroke-dashoffset 0.5s ease,stroke 0.3s"}}/>
                </svg>
                <div className="ring-center">
                  <div className={`cal-num${isOver?" over":""}`}>{totalCal}</div>
                  <div className="cal-label">of {GOAL} kcal</div>
                </div>
              </div>
              <div className="remaining-bar">
                {isOver?<><span style={{color:"#ff6b6b"}}>{Math.abs(remaining)}</span> cal over</>
                       :<><span>{remaining}</span> cal remaining</>}
              </div>
            </div>

            <div className="macros-grid">
              {[
                {key:"protein",label:"Protein",val:totalP,goal:MACRO_GOALS.protein,cls:"protein"},
                {key:"carbs",  label:"Carbs",  val:totalC,goal:MACRO_GOALS.carbs,  cls:"carbs"},
                {key:"fat",    label:"Fat",    val:totalF,goal:MACRO_GOALS.fat,    cls:"fat"},
              ].map(({key,label,val,goal,cls})=>(
                <div key={key} className={`macro-card ${cls}`}>
                  <div className="macro-label">{label}</div>
                  <div className="macro-val">{val}<span style={{fontSize:14}}>g</span></div>
                  <div className="macro-goal">/ {goal}g</div>
                  <div className="macro-bar-bg"><div className="macro-bar-fill" style={{width:`${macroPct(val,goal)}%`}}/></div>
                </div>
              ))}
            </div>

            <div className="search-card">
              <h2>SEARCH FOODS</h2>
              <input className="search-input" placeholder="Search chicken, rice, Tim Hortons..."
                value={searchQ} onChange={e=>{setSearchQ(e.target.value);setSelectedFood(null);}}/>
              {searchQ.trim()&&!selectedFood&&(
                <div className="search-results">
                  {searchResults.length===0
                    ?<div className="search-empty">No results</div>
                    :searchResults.map((food,i)=>{
                      const ul=unitLabel(food);
                      return(
                        <div key={i} className="search-item" onClick={()=>handleFoodTap(food)}>
                          <div style={{flex:1}}>
                            <div className="search-item-name">{food.name}</div>
                            <div className="search-item-macros">P {food.p}g · C {food.c}g · F {food.f}g · per {food.base}{ul.input}</div>
                          </div>
                          <div className="search-item-cal">{food.cal}</div>
                        </div>
                      );
                    })
                  }
                </div>
              )}
              {selectedFood&&(
                <AmountPicker food={selectedFood}
                  onAdd={handleAmountAdd}
                  onCancel={()=>setSelectedFood(null)}/>
              )}
            </div>

            <div className="form-card">
              <h2>ADD MANUALLY</h2>
              <div className="inputs-row">
                {[{key:"protein",label:"Protein (g)"},{key:"carbs",label:"Carbs (g)"},{key:"fat",label:"Fat (g)"}].map(({key,label})=>(
                  <div key={key} className="input-group">
                    <label>{label}</label>
                    <input type="number" min="0" placeholder="0" value={form[key]}
                      onChange={e=>setForm({...form,[key]:e.target.value})}
                      onKeyDown={e=>e.key==="Enter"&&handleManualAdd()}/>
                  </div>
                ))}
              </div>
              <div className="divider">
                <div className="divider-line"/>
                <span className="divider-text">or just calories</span>
                <div className="divider-line"/>
              </div>
              <div className="input-group" style={{marginBottom:12}}>
                <label>Calories only (kcal)</label>
                <input type="number" min="0" placeholder="0" value={form.calories}
                  onChange={e=>setForm({...form,calories:e.target.value})}
                  onKeyDown={e=>e.key==="Enter"&&handleManualAdd()}
                  style={{textAlign:"center",fontSize:16}}/>
              </div>
              <button className="add-btn" onClick={handleManualAdd}>+ ADD</button>
            </div>

            <div className="quick-btns">
              <button className="quick-btn" onClick={()=>addEntry({name:"Beer 🍺",p:1,c:11,f:0,directCal:0})}>
                <div className="quick-btn-emoji">🍺</div>
                <div className="quick-btn-label">BEER</div>
                <div className="quick-btn-cal">110 cal · 11g carbs</div>
              </button>
              <button className="quick-btn" onClick={()=>addEntry({name:"Vodka Shot 🥃",p:0,c:0,f:0,directCal:97})}>
                <div className="quick-btn-emoji">🥃</div>
                <div className="quick-btn-label">SHOT</div>
                <div className="quick-btn-cal">97 cal · vodka</div>
              </button>
            </div>

            <div className="log-section">
              <h2>LOG {entries.length>0&&<button className="clear-btn" onClick={clearToday}>CLEAR ALL</button>}</h2>
              {entries.length===0
                ?<div className="log-empty">No entries yet</div>
                :entries.map(e=>{
                  const cal=e.p*P_CAL+e.c*C_CAL+e.f*F_CAL+(e.directCal||0);
                  return(
                    <div key={e.id} className="log-entry">
                      <div style={{flex:1,minWidth:0}}>
                        <div className="entry-time">{e.time}</div>
                        {e.name&&<div className="entry-name">{e.name}</div>}
                        <div className="entry-macros">
                          {e.directCal&&!e.p&&!e.c&&!e.f?"Calories only":`P ${e.p}g · C ${e.c}g · F ${e.f}g`}
                        </div>
                      </div>
                      <div style={{display:"flex",alignItems:"center",flexShrink:0}}>
                        <div className="entry-cals">{cal}</div>
                        <button className="delete-btn" onClick={()=>deleteEntry(e.id)}>×</button>
                      </div>
                    </div>
                  );
                })
              }
            </div>
          </div>
        )}

        {tab==="calendar"&&(
          <div className="page">
            <div className="cal-header">
              <button className="cal-nav" onClick={()=>setCalMonth(p=>p.m===0?{y:p.y-1,m:11}:{y:p.y,m:p.m-1})}>‹</button>
              <div className="cal-title">{MONTHS[calMonth.m]} {calMonth.y}</div>
              <button className="cal-nav" onClick={()=>setCalMonth(p=>p.m===11?{y:p.y+1,m:0}:{y:p.y,m:p.m+1})}>›</button>
            </div>
            <div className="cal-dow">{DOW.map(d=><div key={d} className="cal-dow-cell">{d}</div>)}</div>
            <div className="cal-grid">
              {calCells.map((d,i)=>{
                if(!d) return <div key={`e${i}`} className="cal-cell empty"/>;
                const dk=dayKey(d);
                const dayCal=dayCalories(allData[dk]||[]);
                const isToday=calMonth.y===todayObj.getFullYear()&&calMonth.m===todayObj.getMonth()&&d===todayObj.getDate();
                return(
                  <div key={d} className={`cal-cell${isToday?" today":""}${dayCal>0?" has-data":""}${selectedDay===d?" selected":""}`}
                    onClick={()=>setSelectedDay(selectedDay===d?null:d)}>
                    <MiniRing calories={dayCal} size={38}/>
                    <div className="cal-day-num">{d}</div>
                  </div>
                );
              })}
            </div>
            <div className="cal-legend">
              <div className="legend-item"><div className="legend-dot" style={{background:"#e8ff5a"}}/> Under goal</div>
              <div className="legend-item"><div className="legend-dot" style={{background:"#ff6b6b"}}/> Over goal</div>
              <div className="legend-item"><div className="legend-dot" style={{background:"#2a2a2a"}}/> No data</div>
            </div>
            {selectedDay&&(
              <div className="cal-detail">
                <h3>{MONTHS[calMonth.m]} {selectedDay}</h3>
                {selCal===0
                  ?<div className="log-empty" style={{padding:"12px 0"}}>No data for this day</div>
                  :<>
                    <div className="cal-detail-ring">
                      <svg width="120" height="120" viewBox="0 0 120 120" style={{transform:"rotate(-90deg)",flexShrink:0}}>
                        <circle cx="60" cy="60" r={selR} fill="none" stroke="#1e1e1e" strokeWidth="10"/>
                        <circle cx="60" cy="60" r={selR} fill="none"
                          stroke={selOver?"#ff6b6b":"#e8ff5a"} strokeWidth="10"
                          strokeDasharray={selCirc} strokeDashoffset={selCirc*(1-Math.min(selCal/GOAL,1))}
                          strokeLinecap="round"/>
                      </svg>
                      <div>
                        <div className="cal-detail-cal" style={{color:selOver?"#ff6b6b":"#e8ff5a"}}>{selCal}</div>
                        <div className="cal-detail-sub">of {GOAL} kcal</div>
                        <div style={{marginTop:6,fontSize:11,color:selOver?"#ff6b6b":"#888",letterSpacing:1}}>
                          {selOver?`${selCal-GOAL} over`:`${GOAL-selCal} remaining`}
                        </div>
                      </div>
                    </div>
                    <div className="cal-detail-macros">
                      {[
                        {label:"Protein",val:selEntries.reduce((s,e)=>s+e.p,0),color:"#ff6b6b"},
                        {label:"Carbs",  val:selEntries.reduce((s,e)=>s+e.c,0),color:"#e8ff5a"},
                        {label:"Fat",    val:selEntries.reduce((s,e)=>s+e.f,0),color:"#74c0fc"},
                      ].map(({label,val,color})=>(
                        <div key={label} className="cdm">
                          <div className="cdm-val" style={{color}}>{val}g</div>
                          <div className="cdm-label">{label}</div>
                        </div>
                      ))}
                    </div>
                  </>
                }
              </div>
            )}
          </div>
        )}
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
